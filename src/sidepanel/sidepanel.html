<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uni-Assist 도우미</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="title">
        <span class="logo">🧰</span>
        <span>Uni-Assist 도우미</span>
      </div>
    </header>

    <main>
      <!-- 기능: 텍스트 추출 -->
      <section class="feature-head">
        <h2>🔤 텍스트 추출</h2>
        <button id="btn-add-rule" class="btn btn-primary" title="새 규칙을 추가하고 페이지에서 요소를 선택합니다">
          + 요소 선택
        </button>
      </section>

      <!-- 규칙 목록 -->
      <section id="rules" class="rules"></section>

      <p id="empty-hint" class="empty-hint">
        <strong>＋ 요소 선택</strong> 버튼을 눌러 페이지의 요소를 선택하세요.<br />
        여러 개를 추가하면 아래에서 순서대로 조합됩니다.
      </p>

      <!-- 조합 설정 -->
      <section class="combine card">
        <div class="card-head">
          <h2>조합 결과</h2>
          <div class="seg" id="mode-seg">
            <button data-mode="join" class="seg-btn active">연결</button>
            <button data-mode="template" class="seg-btn">템플릿</button>
          </div>
        </div>

        <div id="join-opts" class="combine-opts">
          <label>구분자</label>
          <select id="separator">
            <option value="none">없음</option>
            <option value="space">공백</option>
            <option value="newline">줄바꿈</option>
            <option value="tab">탭</option>
            <option value="comma">쉼표(, )</option>
            <option value="custom">직접 입력…</option>
          </select>
          <input id="custom-sep" class="custom-sep hidden" placeholder="구분자 입력" />
        </div>

        <div id="template-opts" class="combine-opts hidden">
          <label>템플릿 <span class="muted">{1}, {2} … = 각 규칙 결과</span></label>
          <textarea id="template" rows="3" placeholder="예) [{1}] {2} - {3}"></textarea>
        </div>

        <div class="result-box">
          <textarea id="result" rows="3" readonly placeholder="조합 결과가 여기에 표시됩니다"></textarea>
          <div class="result-actions">
            <button id="btn-refresh" class="btn btn-ghost" title="현재 페이지에서 모든 요소를 다시 추출">↻ 재추출</button>
            <button id="btn-copy" class="btn btn-primary">📋 복사</button>
          </div>
        </div>
      </section>

      <!-- 사이트 & 단축키 -->
      <section class="shortcut card">
        <div class="card-head">
          <h2>단축키 복사</h2>
          <span id="shortcut-key" class="kbd" title="chrome://extensions/shortcuts 에서 변경">…</span>
        </div>
        <p class="muted hint-text">
          아래 <b>허용 사이트</b>에서 단축키를 누르면, 현재 페이지에서 규칙을 재추출해
          <b>조합 결과를 자동 복사</b>합니다. (사이드 패널을 열어두지 않아도 동작)
        </p>
        <label class="muted">허용 사이트 패턴 <span class="muted">(한 줄에 하나, <code>*</code> 와일드카드)</span></label>
        <textarea id="allowed-patterns" rows="3" spellcheck="false"
          placeholder="https://labdev.unipost.co.kr/redmine"></textarea>
        <div class="result-actions">
          <button id="btn-change-shortcut" class="btn btn-ghost btn-sm">단축키 변경…</button>
        </div>
      </section>

      <!-- 프리셋 -->
      <section class="presets card">
        <div class="card-head">
          <h2>프리셋</h2>
          <div class="header-actions">
            <input id="preset-name" class="preset-name" placeholder="프리셋 이름" />
            <button id="btn-save-preset" class="btn btn-ghost">저장</button>
          </div>
        </div>
        <ul id="preset-list" class="preset-list"></ul>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
